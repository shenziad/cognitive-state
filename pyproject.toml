[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-state-research"
version = "0.1.0"
description = "Research scaffold for task-conditioned Cognitive State in long-horizon LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
api = ["openai>=1.50,<3", "python-dotenv>=1,<2", "tiktoken>=0.7,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
